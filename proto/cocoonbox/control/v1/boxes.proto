syntax = "proto3";

package cocoonbox.control.v1;

option go_package = "github.com/loomhand/cocoonbox/api/gen/cocoonbox/control/v1;controlv1";

// Boxes is served by cocoonbox-api (the edge). Callers authenticate with
// `authorization: Bearer <user token>`.
service Boxes {
  // Ensure creates the caller's box, or wakes it, and returns immediately.
  // Idempotent per (box, flavor). Progress arrives on WatchOperation.
  rpc Ensure(EnsureRequest) returns (EnsureResponse);
  // Create adds a box to the caller's boxes and starts it, within the user's
  // box quota and the api's running limit.
  rpc Create(CreateBoxRequest) returns (EnsureResponse);
  rpc Rename(RenameBoxRequest) returns (Box);
  // Delete saves the box quiesced when it runs, then removes its machine and
  // the box. Its saved state stays in object storage.
  rpc Delete(BoxRef) returns (Operation);
  rpc Get(GetBoxRequest) returns (Box);
  rpc List(ListBoxesRequest) returns (ListBoxesResponse);
  // Watch sends the caller's boxes as List does, at once and again after any
  // of them changes, by any client or by the api. Watching never wakes a box.
  rpc Watch(WatchBoxesRequest) returns (stream ListBoxesResponse);
  rpc Hibernate(BoxRef) returns (Operation);
  rpc WatchOperation(WatchOperationRequest) returns (stream OperationEvent);
  // SaveState writes a quiesced snapshot of the box's user state (home,
  // /workspace, agent.db) to object storage. The browser closes for the copy.
  rpc SaveState(BoxRef) returns (Operation);
  // Rebase moves the box to another image and carries its user state over:
  // quiesced save, new machine from the image, restore, switch, delete the old
  // machine. The box id stays the same; running programs restart.
  rpc Rebase(RebaseRequest) returns (Operation);
  // ListSnapshots lists the box's kept snapshots, newest first.
  rpc ListSnapshots(BoxRef) returns (ListSnapshotsResponse);
  // BrowseSnapshot lists one directory of a kept snapshot; the box may be
  // hibernated.
  rpc BrowseSnapshot(BrowseSnapshotRequest) returns (BrowseSnapshotResponse);
  // RestorePaths copies files and folders of a kept snapshot into
  // ~/Restored/<save time>/ in the running box (PHASE_RESTORING_FILES).
  // Nothing outside that folder changes and nothing restarts.
  rpc RestorePaths(RestorePathsRequest) returns (Operation);
  // SetWakeSchedule replaces the box's wake schedule. A minute before each
  // time of cron in tz, the api wakes the box when it is hibernated. After
  // awake_for it hibernates the box again, unless a client reached the box
  // since that wake or an operation runs. The api keeps no routine: the box
  // runs its own timers.
  rpc SetWakeSchedule(SetWakeScheduleRequest) returns (WakeSchedule);
  // ListWakeSchedules lists the wake schedules of the caller's boxes.
  rpc ListWakeSchedules(ListWakeSchedulesRequest) returns (ListWakeSchedulesResponse);
  // ClearWakeSchedule removes the box's wake schedule; a box the alarm woke
  // stays up.
  rpc ClearWakeSchedule(BoxRef) returns (ClearWakeScheduleResponse);
  rpc Usage(UsageRequest) returns (UsageResponse);
}

enum BoxState {
  BOX_STATE_UNSPECIFIED = 0;
  BOX_STATE_STARTING = 1;
  BOX_STATE_RUNNING = 2;
  BOX_STATE_HIBERNATING = 3;
  BOX_STATE_HIBERNATED = 4;
  BOX_STATE_FAILED = 5;
}

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_CREATING = 1;
  PHASE_WAKING = 2;
  PHASE_SNAPSHOTTING = 3;
  PHASE_DONE = 4;
  PHASE_FAILED = 5;
  // Uploading the user state to object storage.
  PHASE_SAVING = 6;
  // Writing the user state into a new machine.
  PHASE_RESTORING = 7;
  // Removing the box's machine.
  PHASE_DELETING = 8;
  // Copying files of a snapshot into the running box.
  PHASE_RESTORING_FILES = 9;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIR = 2;
  ENTRY_KIND_SYMLINK = 3;
}

message BoxRef {
  string box_id = 1;
}

message Flavor {
  uint32 vcpus = 1;
  uint32 memory_mib = 2;
  uint32 disk_gib = 3;
}

message Box {
  string id = 1;
  BoxState state = 2;
  string image = 3;
  Flavor flavor = 4;
  string failure_reason = 5;
  int64 created_at_ms = 6;
  // Time of the latest user-state snapshot in object storage; 0 before the first.
  int64 last_saved_at_ms = 7;
  // Image a new box gets today, and the default Rebase target; differs from image when an upgrade is available.
  string latest_image = 8;
  // Unique among the user's boxes.
  string name = 9;
}

message Operation {
  string id = 1;
  string box_id = 2;
}

message EnsureRequest {
  Flavor flavor = 1;
  // Empty selects the user's first box, and creates one when the user has none.
  string box_id = 2;
}

message CreateBoxRequest {
  string name = 1;
  // Empty selects the current default image.
  string image = 2;
  Flavor flavor = 3;
}

message RenameBoxRequest {
  string box_id = 1;
  string name = 2;
}

message EnsureResponse {
  Box box = 1;
  // Empty when the box is already running.
  Operation operation = 2;
}

message RebaseRequest {
  string box_id = 1;
  // Target image; empty selects the current default image.
  string image = 2;
}

message GetBoxRequest {
  string box_id = 1;
}

message ListBoxesRequest {}

message ListBoxesResponse {
  repeated Box boxes = 1;
  // Images CreateBoxRequest.image may name, the default image first; the
  // family of one is the name before ':'.
  repeated string offered_images = 2;
}

message WatchBoxesRequest {}

message WatchOperationRequest {
  string operation_id = 1;
  // Resume after this offset; empty replays from the start.
  string from_offset_key = 2;
}

message OperationEvent {
  string operation_id = 1;
  Phase phase = 2;
  string detail = 3;
  string offset_key = 4;
  int64 at_ms = 5;
  BoxState box_state = 6;
  // Transfer progress while saving or restoring; 0 otherwise.
  uint64 done_bytes = 7;
  uint64 total_bytes = 8;
}

message Snapshot {
  string id = 1;
  int64 saved_at_ms = 2;
  bool quiesced = 3;
  uint64 files = 4;
  uint64 logical_bytes = 5;
  // Files new, changed or removed since the save before; absent for saves by
  // agents older than this field.
  optional uint64 changed_files = 6;
  // Plaintext bytes of the chunks this save added to the store.
  uint64 added_bytes = 7;
}

message ListSnapshotsResponse {
  repeated Snapshot snapshots = 1;
}

message BrowseSnapshotRequest {
  string box_id = 1;
  string snapshot_id = 2;
  // A box path such as /home/user/Documents; empty lists the roots.
  string dir = 3;
}

message SnapshotEntry {
  // The box path.
  string path = 1;
  EntryKind kind = 2;
  uint64 size = 3;
  int64 mtime_ms = 4;
}

message BrowseSnapshotResponse {
  repeated SnapshotEntry entries = 1;
  // The directory holds more entries than one answer carries.
  bool truncated = 2;
}

message RestorePathsRequest {
  string box_id = 1;
  string snapshot_id = 2;
  // Box paths of files or folders, each under /home/user or /workspace.
  repeated string paths = 3;
}

message WakeSchedule {
  string box_id = 1;
  // Five fields: minute, hour, day of month, month, day of week.
  string cron = 2;
  // IANA zone name of cron, such as Asia/Singapore.
  string tz = 3;
  uint32 awake_for_s = 4;
  // The next time of cron; the wake comes a minute before it.
  int64 next_at_ms = 5;
  // The latest wake of this schedule from hibernation; 0 before the first.
  int64 last_wake_at_ms = 6;
}

message SetWakeScheduleRequest {
  string box_id = 1;
  string cron = 2;
  string tz = 3;
  // 0 selects the default, 15 minutes.
  uint32 awake_for_s = 4;
}

message ListWakeSchedulesRequest {}

message ListWakeSchedulesResponse {
  repeated WakeSchedule schedules = 1;
}

message ClearWakeScheduleResponse {}

message UsageRequest {}

message UsageResponse {
  UsagePeriod today = 1;
  UsagePeriod month = 2;
  int64 daily_cap_micros = 3;
  bool default_cap = 4;
  int64 remaining_today_micros = 5;
}

message UsagePeriod {
  int64 since_ms = 1;
  int64 requests = 2;
  int64 prompt_tokens = 3;
  int64 completion_tokens = 4;
  int64 total_tokens = 5;
  int64 cost_micros = 6;
  repeated ModelUsage models = 7;
}

message ModelUsage {
  string model = 1;
  int64 requests = 2;
  int64 prompt_tokens = 3;
  int64 completion_tokens = 4;
  int64 total_tokens = 5;
  int64 cost_micros = 6;
}
