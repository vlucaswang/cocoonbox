# Builds the Android box base (AOSP redroid only) for amd64 and arm64 and publishes it as ghcr.io/<repo>/android-base:
# a <sha> tag, and latest from main; a pull request only builds it. Booting it needs binder and ashmem, so its acceptance
# runs on a host after a cut, as for base:vN.
name: android-base

on:
  push:
    branches: [main]
    paths: &paths
      - "image/android/**"
      - "image/desk/shuttle.sh"
      - ".github/workflows/android-base.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps: &steps
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake redroid
        run: |
          for arch in amd64 arm64; do
            start=$(date +%s)
            ARCH=$arch bash image/android/base/bake.sh
            echo "bake $arch: $(( $(date +%s) - start )) s"
          done

      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}/android-base"
          tags="$image:${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags,$image:latest"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: image
          file: image/android/base/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps: *steps
