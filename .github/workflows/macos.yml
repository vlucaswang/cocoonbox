name: macos

on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "Package.swift"
      - "proto/**"
      - ".github/workflows/macos.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          echo "CB_TESTING_FRAMEWORKS=$(xcode-select -p)/Platforms/MacOSX.platform/Developer/Library/Frameworks" >> "$GITHUB_ENV"
          echo "CB_TESTING_INTEROP=$(xcode-select -p)/Platforms/MacOSX.platform/Developer/usr/lib" >> "$GITHUB_ENV"
          swift --version

      # the suite runs serially: in parallel on the runner's three cores no test finished in 30 minutes;
      # the update-rate gate needs a 30 fps synthetic source, which the runner renders at about 18
      - name: App build and tests
        run: make macos MACOS_TEST_ARGS="--no-parallel --skip updateRateAcrossALongPath"

      - name: Root package builds the Kit and the CLI
        run: bash -c 'source macos/scripts/toolchain.sh && swift build --product CocoonBoxKit && swift build --product CocoonBoxTerminal && swift build --product cocoonbox-cli'

      - name: App bundle carries the icon
        env:
          CB_ENDPOINT: https://box.example.com
        run: |
          make app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' macos/dist/CocoonBox.app/Contents/Info.plist)" = AppIcon
          iconutil -c iconset -o "$RUNNER_TEMP/AppIcon.iconset" macos/dist/CocoonBox.app/Contents/Resources/AppIcon.icns
          ls "$RUNNER_TEMP/AppIcon.iconset"
