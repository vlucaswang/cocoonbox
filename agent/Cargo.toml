[package]
name = "cocoonbox-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "In-box agent for cocoonbox: agent loop, gRPC surface and tool host"
license = "AGPL-3.0-only"
publish = false

[[bin]]
name = "cocoonbox-agent"
path = "src/main.rs"

[dependencies]
aes = { version = "0.9", features = ["zeroize"] }
aes-gcm = { version = "0.11", features = ["zeroize"] }
axum = { version = "0.8", default-features = false }
base64 = "0.23"
bytes = "1"
ed25519-dalek = "3"
fastcdc = "5"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
image-webp = "0.2"
jpeg-encoder = "0.7"
libc = "0.2"
png = "0.18"
prost = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
shuttle-desk-core = { git = "https://github.com/loomhand/shuttle", tag = "v0.1.1" }
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "sync", "time", "fs", "signal"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "codegen"] }
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4"] }
x11rb = { version = "0.14", features = ["shm", "shape", "xinput"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
zeroize = "1"
zstd = { version = "0.14", default-features = false }

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
